[project]
name = "bnf-wrf-da"
version = "0.1.0"
description = "WRF-DART radar+conventional data assimilation for LASSO BNF LES forcing"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
